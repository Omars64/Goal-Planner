services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      VICE_PLANNER_DB_PATH: /data/vice_planner.db
      VICE_PLANNER_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - planner-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  planner-data:

