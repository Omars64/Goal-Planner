services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      VICE_PLANNER_DB_PATH: /data/vice_planner.db
      VICE_PLANNER_CORS_ORIGINS: http://localhost:3000
      GOAL_PLANNER_ADMIN_EMAIL: ${GOAL_PLANNER_ADMIN_EMAIL:-admin@example.com}
      GOAL_PLANNER_ADMIN_USERNAME: ${GOAL_PLANNER_ADMIN_USERNAME:-Admin}
      GOAL_PLANNER_ADMIN_PASSWORD: ${GOAL_PLANNER_ADMIN_PASSWORD:-ChangeMe123!}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Goal Planner}
    ports:
      - "8000:8000"
    volumes:
      - planner-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  planner-data:
